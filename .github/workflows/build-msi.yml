name: build-windows-msi

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Hermes source ref (prefer immutable SHA)'
        required: false
        default: '041b6985a00d01b54f830c1607dd370007a306bf'
      run_golden:
        description: 'Run the Win10 release gate. windows-2022 cannot satisfy it.'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Static project validation
        shell: pwsh
        run: python tests/validate_project.py

      - name: Enterprise content tests
        shell: pwsh
        run: .\tests\Test-EnterpriseContent.ps1

      - name: Windows launcher tests
        shell: pwsh
        run: python -B tests/test_launcher.py

      - name: Bundle integrity fixtures
        shell: pwsh
        run: .\tests\Test-BundleIntegrity.ps1

      - name: Python offline install fixtures
        shell: pwsh
        run: .\tests\Test-PythonOfflineInstall.ps1

      - name: v2 static gates
        shell: pwsh
        run: |
          .\tests\v2\TEST-A-SRC-001.ps1
          .\tests\v2\TEST-A-MSI-001.ps1
          .\tests\v2\TEST-A-BUILD-002.ps1

      - name: Build MSI
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HERMES_MANIFEST_ED25519_SEED_B64: ${{ secrets.HERMES_MANIFEST_ED25519_SEED_B64 }}
        run: .\build\Build.ps1 -SourceRef '${{ inputs.source_ref }}'

      - name: Build-gate proof
        shell: pwsh
        run: .\tests\Test-BuildOfflineProof.ps1

      - name: uv environment isolation
        shell: pwsh
        run: .\tests\Test-UvEnvIsolation.ps1

      # A real per-user msiexec of A-PY-001 and A-OBS-003 is not this job.
      # Hook that gate to a self-hosted Windows runner when one is available.

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-enterprise-installer-v2
          path: |
            dist/*
            evidence/*
          if-no-files-found: error

  golden:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_golden == true }}
    runs-on: [self-hosted, windows-10]
    steps:
      - uses: actions/checkout@v4
      - name: Release gate
        shell: pwsh
        run: .\tests\release\Evaluate-ReleaseGate.ps1
